<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="panel.css">
    <title>Mon Panel</title>
</head>
<body>
    <script>
      if (window.location.href.includes('panel.html')) {
        document.body.classList.add('is-panel-html');
      }
    </script>
    <!--
      Ce fichier HTML sert à la fois :
      - de template pour l'injection dynamique du panneau dans les pages (panel-listener.js va charger ce fichier et extraire #custom-side-panel)
      - de preview pour le développement (quand tu ouvres panel.html directement)
      Modifie ici la structure du panneau, elle sera répercutée partout.
    -->
    <div id="custom-side-panel" class="custom-side-panel">
      <div id="header" class="header">
        Extension TTO
      </div>
      <div id="imageContainer" class="image-grid"></div>
      <!--
        Template HTML pour une carte image :
        Ce template ne s'affiche pas directement, il sert de modèle pour créer dynamiquement chaque carte via JS.
        Avantage : la structure HTML reste claire et réutilisable.
      -->
      <template id="image-card-template">
        <div class="image-card">
          <img class="image-item" src="" alt="Image">
          <div class="image-details">
            <div class="size"></div>
            <div class="format"></div>
            <div class="weight"></div>
          </div>
        </div>
      </template>
    </div>
    <script src="panel-listener.js"></script>
</body>
</html>
