<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="panel.css">
    <title>Mon Panel</title>
</head>
<body>
    <script>
      if (window.location.href.includes('panel.html')) {
        document.body.classList.add('is-panel-html');
      }
    </script>
    <!--
      Ce fichier HTML sert à la fois :
      - de template pour l'injection dynamique du panneau dans les pages (panel-listener.js va charger ce fichier et extraire #custom-side-panel)
      - de preview pour le développement (quand tu ouvres panel.html directement)
      Modifie ici la structure du panneau, elle sera répercutée partout.
    -->
    <div id="custom-side-panel" class="custom-side-panel">
      <div id="header" class="header">
        Extension TTO
      </div>
      <div id="imageContainer" class="image-grid"></div>
    </div>
    <script src="panel-listener.js"></script>
    <script>
        // Charger les données de test dès le chargement de la page
        loadTestData().then(testImages => {
            console.log('Images de test chargées:', testImages); // Affiche les images de test dans la console
            updateImages(testImages); // Affiche les images de test
        }).catch(error => {
            console.error('Erreur lors du chargement des données de test:', error);
        });
    </script>
</body>
</html>
